name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modbus-version: ["4.8.1", "4.12.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "modbus-connection==${{ matrix.modbus-version }}"
      - run: python -m unittest discover -s tests -v

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: >-
          python -m pip install "homeassistant==2026.9.4"
          "pymodbus==3.13.1" "modbus-connection[tmodbus]==4.10.0" "tmodbus==0.6.2"
      - run: python -m unittest discover -s tests -v

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
